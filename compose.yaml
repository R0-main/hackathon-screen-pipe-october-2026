# Company brain on a company machine, reachable on the local network over HTTPS.
# Start: sh deploy/local/brain-local.sh up   (writes .env, builds, starts, shows the address). Docs: docs/LOCAL.md
name: company-brain

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brain
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (sh deploy/local/brain-local.sh up does it)}
    volumes:
      - brain-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  brain:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://brain:${POSTGRES_PASSWORD}@postgres:5432/brain
      # Postgres on the Docker network, without TLS (the traffic does not leave the machine).
      DATABASE_SSL: disable
      BRAIN_PUBLIC_URL: https://${BRAIN_HOST:-localhost}
      # Root certificate of Caddy's private authority (shared volume, read-only): served on /ca.crt, pinned in the prompts.
      BRAIN_CA_FILE: ${BRAIN_CA_FILE:-/caddy/caddy/pki/authorities/local/root.crt}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BRAIN_DEMO: ${BRAIN_DEMO:-}
      BRAIN_SIGNUP: ${BRAIN_SIGNUP:-}
      BRAIN_TIMEZONE: ${BRAIN_TIMEZONE:-Europe/Paris}
    volumes:
      - caddy-data:/caddy:ro
      - ./deploy/local/certs:/certs:ro
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - brain
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Names and addresses of the brain on the local network, all in the certificate: "localhost, 192.168.1.20, finance-desk.local"
      BRAIN_HOSTS: ${BRAIN_HOSTS:-localhost}
      # "internal" (Caddy's private authority) or your files: "/certs/cert.pem /certs/key.pem" (folder deploy/local/certs)
      BRAIN_TLS: ${BRAIN_TLS:-internal}
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/local/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  brain-postgres:
  caddy-data:
  caddy-config:
