# `make dev` on a fresh computer: Postgres with Docker, then without Docker (private Postgres, as on a 42 school
# computer), with ports changed in .env. The dashboard must answer and the migrations must pass.
name: Local run (make)

on:
  workflow_dispatch:
  push:
    paths: [Makefile, .env.example, scripts/**, apps/web/app/page.tsx, package-lock.json, supabase/**, .github/workflows/make.yml]
  pull_request:
    paths: [Makefile, .env.example, scripts/**, apps/web/app/page.tsx, package-lock.json, supabase/**, .github/workflows/make.yml]

jobs:
  make-dev:
    name: make dev (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db: [docker, private]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: .env with other ports
        run: |
          cp .env.example .env
          sed -i 's/^BRAIN_PORT=.*/BRAIN_PORT=3100/; s/^POSTGRES_PORT=.*/POSTGRES_PORT=55432/' .env
      - name: make dev
        env:
          LOCAL_DB: ${{ matrix.db }}
          BRAIN_OPEN: "0"
        run: |
          make dev > dev.log 2>&1 &
          for i in $(seq 1 180); do curl -fsS http://localhost:3100/api/health && break; sleep 2; done
          echo
          curl -fsS http://localhost:3100/api/health
          make db-status
          make migrate | tee migrate.log
          grep -q "already applied" migrate.log
          # Fresh local brain: / leads to company creation, not to the public page.
          loc=$(curl -sS -o /dev/null -w '%{redirect_url}' http://localhost:3100/)
          echo "/ → $loc"
          case "$loc" in */create) ;; *) echo "expected: redirect to /create"; exit 1 ;; esac
      - name: make seed (Encore)
        env:
          LOCAL_DB: ${{ matrix.db }}
        run: make seed
      - name: Log
        if: always()
        run: cat dev.log; ls .local/postgres 2>/dev/null && cat .local/postgres/postgres.log 2>/dev/null || true
      - name: make stop
        if: always()
        env:
          LOCAL_DB: ${{ matrix.db }}
        run: make stop
