name: CI

# Typecheck and tests (core + client) on every push and pull request, plus the install on a real Windows.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        # install.sh then really downloads the private copy of Node.js (~30 MB, a few seconds); pwsh, present on
        # the Ubuntu image, parses and runs install.ps1.
        env:
          BRAIN_TEST_NETWORK: "1"
        run: npm test

  windows:
    # install.ps1 under Windows PowerShell 5.1, brain.cmd run by cmd, install.sh in Git Bash, private copy of
    # Node.js (official zip). Only the install tests: the others fake `claude` with #!/bin/sh scripts.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # install.sh keeps its LF line endings, even checked out on Windows.
      - name: Line endings as is
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dependencies
        run: npm install --no-audit --no-fund
      - name: Install tests
        working-directory: apps/client
        env:
          BRAIN_TEST_NETWORK: "1"
        run: node --import tsx --test test/install-script.test.ts
