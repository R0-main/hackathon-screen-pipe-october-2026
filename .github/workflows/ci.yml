name: CI

# Typecheck et tests (core + client) à chaque push et pull request, plus l'installation sur un vrai Windows.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        # install.sh télécharge alors vraiment la copie privée de Node.js (~30 Mo, quelques secondes) ; pwsh, présent sur
        # l'image Ubuntu, analyse et fait tourner install.ps1.
        env:
          BRAIN_TEST_NETWORK: "1"
        run: npm test

  windows:
    # install.ps1 sous Windows PowerShell 5.1, brain.cmd lancé par cmd, install.sh dans Git Bash, copie privée de
    # Node.js (zip officiel). Seulement les tests d'installation : les autres simulent `claude` par des scripts #!/bin/sh.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # install.sh garde ses fins de ligne LF, même extrait sous Windows.
      - name: Fins de ligne telles quelles
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances
        run: npm install --no-audit --no-fund
      - name: Tests d'installation
        working-directory: apps/client
        env:
          BRAIN_TEST_NETWORK: "1"
        run: node --import tsx --test test/install-script.test.ts
