# Self-hosted brain (docs/LOCAL.md): the Docker image builds, Postgres + brain + Caddy start, the root certificate
# is served and pinned in the prompt, and a computer installs exactly as the prompt would do it (without Screenpipe).
name: Self-hosting (Docker)

on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - deploy/local/**
      - apps/web/public/install.sh
      - apps/web/lib/ca.ts
      - apps/web/lib/install-prompt.ts
      - apps/web/app/ca.crt/**
      - apps/client/src/**
      - .github/workflows/local.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - deploy/local/**
      - apps/web/public/install.sh
      - apps/web/lib/ca.ts
      - apps/web/lib/install-prompt.ts
      - apps/web/app/ca.crt/**
      - apps/client/src/**
      - .github/workflows/local.yml

jobs:
  compose:
    name: compose up, local HTTPS, install of a computer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configuration (.env)
        run: |
          cat > .env <<ENV
          POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)
          BRAIN_HOSTS=localhost
          BRAIN_HOST=localhost
          BRAIN_TLS=internal
          ENV

      - name: Build and start (Postgres, brain, Caddy)
        run: docker compose up -d --build --wait

      - name: Root certificate served over HTTP, the same over HTTPS, brain health
        run: |
          for i in $(seq 1 30); do curl -fsS http://localhost/ca.crt -o ca.crt && break; sleep 2; done
          openssl x509 -in ca.crt -noout -subject -fingerprint -sha256
          FP=$(openssl x509 -in ca.crt -noout -fingerprint -sha256 | cut -d= -f2 | tr -d :)
          curl -fsS --cacert ca.crt https://localhost/ca.crt | diff - ca.crt
          curl -fsS --cacert ca.crt https://localhost/api/health
          echo
          echo "FP=$FP" >> "$GITHUB_ENV"

      - name: Create a company (/create) and pinned install prompt
        run: |
          curl -fsS --cacert ca.crt -X POST https://localhost/api/orgs -H 'content-type: application/json' \
            -d '{"company":"Encore CI","name":"Claire CI","title":"CEO","zones":["finance","dev"]}' -o org.json
          node -e '
            const fs = require("fs");
            const o = JSON.parse(fs.readFileSync("org.json", "utf8"));
            if (!o.prompt.includes(process.env.FP)) { console.error(o.prompt); throw new Error("certificate fingerprint missing from the prompt"); }
            const token = /--token (cb_[A-Za-z0-9_-]+)/.exec(o.prompt)[1];
            fs.writeFileSync("token.txt", token);
            console.log("prompt OK (" + o.prompt.length + " characters), company " + o.org.name);
          '

      - name: Install a computer as the prompt would do it (without Screenpipe)
        env:
          HOME: ${{ runner.temp }}/home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
        run: |
          mkdir -p "$HOME" "$CLAUDE_CONFIG_DIR"
          TOKEN=$(cat token.txt)
          mkdir -p ~/.company-brain && curl -ksSL https://localhost/ca.crt -o ~/.company-brain/ca.crt \
            && [ "$(openssl x509 -in ~/.company-brain/ca.crt -noout -fingerprint -sha256 | cut -d= -f2 | tr -d :)" = "$FP" ] \
            && curl -fsSL --cacert ~/.company-brain/ca.crt https://localhost/install.sh -o ~/.company-brain/install.sh \
            && sh ~/.company-brain/install.sh --url https://localhost --token "$TOKEN" --ca ~/.company-brain/ca.crt --skip-screenpipe --no-open
          ~/.company-brain/brain status | tee status.txt
          grep -E "Connection +: OK — Claire CI, Encore CI" status.txt
          grep -E "Certificate +: .*SHA-256 fingerprint $FP" status.txt
          grep -E "Claude hooks +: installed" status.txt

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=200
